<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>自动画中画</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon48.png" alt="" width="28" height="28">
    <div class="head-text">
      <h1>自动画中画</h1>
      <p class="status" id="status" data-state="loading">
        <span class="dot"></span><span id="status-text">正在检测…</span>
      </p>
    </div>
  </header>

  <main class="panel">
    <label class="row row--primary">
      <span class="row-text">
        <span class="row-title">切换标签页时进入画中画</span>
        <span class="row-desc">视频正在播放时，切到其他标签页自动浮窗</span>
      </span>
      <input type="checkbox" id="enabled" class="switch">
    </label>

    <label class="row">
      <span class="row-text">
        <span class="row-title">返回标签页时自动退出</span>
        <span class="row-desc">回到这个标签页后，把视频收回页面内</span>
      </span>
      <input type="checkbox" id="exitOnReturn" class="switch">
    </label>

    <p class="row-desc">连续自动浮窗需允许网站自动画中画并保持视频有声，部分网站不支持。</p>
  </main>

  <button type="button" id="test" class="test-btn">手动进入 / 退出画中画</button>
  <p class="hint" id="hint" hidden></p>

  <footer class="foot">
    <span id="version"></span> · 仅在<b>切换标签页</b>时尝试自动浮窗。
  </footer>

  <script src="popup.js"></script>
</body>
</html>
